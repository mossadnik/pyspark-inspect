
# CTE
- id: SQL_0001
  sql: |-
    with t as (select 1 as a)
    select * from t

# select
- id: SQL_0002
  sql: |-
    select a, c, sum(b) over (partition by c) as x
    from (select 1 as a, 2 as b, 3 as c)

# filter
- id: SQL_0003
  sql: |-
    select *
    from (select 1 as a)
    where a = 1

# joins
- id: SQL_0004
  sql: |-
    select *
    from (select 1 as a) s
    cross join (select 1 as b) t
- id: SQL_0005
  sql: |-
    select *
    from (select 1 as a) s
    inner join (select 1 as b) t
    on s.a = t.b

# set operations
# - union, minus, intersect
- id: SQL_0006
  sql: |-
    select 1 as a
    union all
    select 2 as a
- id: SQL_0007
  sql: |-
    select 1 as a
    except all
    select 2 as a
- id: SQL_0008
  sql: |-
    select 1 as a
    intersect all
    select 2 as a


# group by operations
- id: SQL_0009
  sql: |-
    select a, count(*) as b
    from (select 1 as a)
    group by a

# other
- id: SQL_0010
  sql: |-
    select distinct a
    from (select 1 as a, 2 as b)
- id: SQL_0011
  sql: |-
    select 1 as a limit 1
